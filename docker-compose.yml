networks:
  keycloak-network:
    driver: bridge

volumes:
  keycloak-postgres-data:
  backend-postgres-data:
  idp-postgres-data:

services:
  # Keycloak PostgreSQL Database
  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak Server
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_DB_SCHEMA: public
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      # Mount the whole realms/ directory; --import-realm imports every JSON file in it.
      - ./authorization-server/keycloak/realms:/opt/keycloak/data/import
    # `host.docker.internal` reaches the dev machine from inside the container,
    # which is how Keycloak's server-to-server calls find the IdP server when
    # it's running locally (./gradlew bootRun) outside Docker. Docker Desktop
    # on Mac/Windows wires this automatically; Linux needs the explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - keycloak-network

  # IdP PostgreSQL Database (used by idp-server — separate instance from
  # backend-postgres and keycloak-postgres on purpose: the playground's
  # pedagogy is that each component owns its own datastore.)
  idp-postgres:
    image: postgres:16
    container_name: idp-postgres
    environment:
      POSTGRES_DB: idpdb
      POSTGRES_USER: idpuser
      POSTGRES_PASSWORD: idppass123
    volumes:
      - idp-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idpuser -d idpdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application PostgreSQL Database (used by resource-backend)
  backend-postgres:
    image: postgres:16
    container_name: backend-postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass123
    volumes:
      - backend-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - keycloak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Resource Server (OAuth2 resource server)
  resource-backend:
    build:
      context: ./web-app/resource-backend
      dockerfile: Dockerfile
    container_name: resource-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://backend-postgres:5432/appdb
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppass123
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/playground
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/playground/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_started
      backend-postgres:
        condition: service_healthy
    networks:
      - keycloak-network

  # React Public Client (OAuth2 public client)
  client-frontend:
    build:
      context: ./web-app/client-frontend
      dockerfile: Dockerfile
    container_name: client-frontend
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: playground
      VITE_KEYCLOAK_CLIENT_ID: react-client
      VITE_API_BASE_URL: http://localhost:8081
    ports:
      - "5173:5173"
    depends_on:
      - resource-backend
      - keycloak
    networks:
      - keycloak-network
